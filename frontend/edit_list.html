<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EverythingRanker — Edit List</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* ── Design Tokens ───────────────────────────── */
  :root {
    --bg:           #3D3D3D;
    --nav-bg:       #1D1D1D;
    --panel:        #525252;
    --circle:       #D9D9D9;
    --orange:       #F9AD60;
    --blue:         #71A5FF;
    --green:        #56BB09;
    --red:          #FF0000;
    --text:         #FFFFFF;
    --plus-stroke:  #1E1E1E;
    --icon-fill:    #E3E3E3;

    --shadow-text:  -4px 4px 4px rgba(0, 0, 0, 0.25);
    --shadow-title: 4px 4px 4px rgba(0, 0, 0, 0.25);
    --shadow-card:  0px 4px 4px rgba(0, 0, 0, 0.25);

    --radius-pill:  20px;
    --radius-panel: 10px;
    --radius-btn:   15px;
  }

  /* ── Reset ───────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--text);
    min-height: 100vh;
    padding: 20px 20px 46px;
  }

  .container {
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* ── Navbar ──────────────────────────────────── */
  .navbar {
    width: 100%;
    height: 50px;
    background: var(--nav-bg);
    border-radius: var(--radius-pill);
    padding: 10px 35px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .wordmark {
    font-size: 24px;
    font-weight: 800;
    line-height: 29px;
    text-decoration: none;
    text-shadow: var(--shadow-text);
  }
  .wordmark .orange { color: var(--orange); }
  .wordmark .blue   { color: var(--blue); }

  .nav-icons {
    display: flex;
    align-items: center;
    gap: 46px;
  }

  .icon-btn {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--icon-fill);
    transition: opacity 0.15s;
  }
  .icon-btn:hover { opacity: 0.75; }
  .icon-btn svg   { display: block; }
  .icon-btn .person path { fill: var(--icon-fill); }

  /* ── Title ───────────────────────────────────── */
  .list-title {
    margin-top: 56px;
    font-size: 48px;
    font-weight: 600;
    line-height: 58px;
    text-align: center;
    color: var(--text);
    text-shadow: var(--shadow-title);
  }

  /* ── Toolbar (Set to Private / Delete List) ──── */
  .toolbar {
    width: 100%;
    max-width: 742px;
    margin: 50px auto 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .privacy {
    display: inline-flex;
    align-items: center;
    gap: 18px;
    color: var(--text);
    font-size: 20px;
    font-weight: 600;
    line-height: 24px;
  }

  /* ── Figma M3-style Switch ───────────────────── */
  /* Track (the colored pill) */
  .switch {
    position: relative;
    width: 52px;
    height: 32px;
    border-radius: 100px;
    border: none;
    padding: 2px 4px;
    cursor: pointer;
    background: var(--orange);
    display: flex;
    flex-direction: row;
    justify-content: flex-end;     /* knob on the right when ON */
    align-items: center;
    transition: background-color 0.18s ease, justify-content 0s;
    flex-shrink: 0;
  }
  /* OFF state: dark/transparent track with light border, knob on the left */
  .switch.off {
    background: transparent;
    border: 2px solid rgba(255, 255, 255, 0.55);
    /* Compensate for border so size stays 52x32 */
    padding: 0 2px;
    justify-content: flex-start;
  }

  /* Target (40x40 touch / state-layer area, centered on knob) */
  .switch-target {
    width: 40px;
    height: 40px;
    border-radius: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Pulled out so the 40x40 touch area extends past the 32px-tall track */
    margin: 0 -8px;
    pointer-events: none;
  }

  /* State-layer: invisible by default, reveals on hover/focus per M3 */
  .switch-state-layer {
    width: 40px;
    height: 40px;
    border-radius: 100px;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.15s ease;
  }
  .switch:hover  .switch-state-layer { background: rgba(255, 255, 255, 0.08); }
  .switch:focus-visible .switch-state-layer { background: rgba(255, 255, 255, 0.12); }
  .switch:focus-visible { outline: none; }

  /* Handle (the visible white knob) */
  .switch-handle {
    width: 24px;
    height: 24px;
    border-radius: 100px;
    background: #FFFFFF;
  }
  /* OFF state: smaller dark-gray knob per Figma M3 spec */
  .switch.off .switch-handle {
    width: 16px;
    height: 16px;
    background: rgba(255, 255, 255, 0.55);
  }

  .delete-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    color: var(--text);
    font-size: 20px;
    font-weight: 600;
    line-height: 24px;
    transition: opacity 0.15s;
  }
  .delete-btn:hover { opacity: 0.8; }
  .delete-btn svg   { display: block; color: var(--red); }

  /* ── Items panel ─────────────────────────────── */
  .items-panel {
    width: 100%;
    max-width: 742px;
    margin: 12px auto 0;
    background: var(--panel);
    border-radius: var(--radius-panel);
    box-shadow: var(--shadow-card);
    padding: 50px 126px;
    display: flex;
    flex-direction: column;
    gap: 30px;
  }

  .item-row {
    display: flex;
    align-items: center;
    gap: 100px;
  }

  .item-circle {
    width: 133px;
    height: 133px;
    border-radius: 50%;
    background: var(--circle);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Plus icon inside Item_03's circle */
  .plus {
    position: relative;
    width: 40px;
    height: 40px;
  }
  .plus::before, .plus::after {
    content: "";
    position: absolute;
    background: var(--plus-stroke);
    border-radius: 1px;
  }
  .plus::before {
    left: 50%;
    top: 0;
    width: 4px;
    height: 100%;
    transform: translateX(-50%);
  }
  .plus::after {
    top: 50%;
    left: 0;
    height: 4px;
    width: 100%;
    transform: translateY(-50%);
  }

  .item-name {
    font-size: 20px;
    font-weight: 600;
    line-height: 24px;
    color: var(--text);
    text-align: center;
  }

  /* ── Add new item + Done row ─────────────────── */
  .footer-row {
    width: 100%;
    max-width: 1400px;
    margin: 34px auto 0;
    display: grid;
    grid-template-columns: 1fr 742px 1fr;
    align-items: center;
    column-gap: 24px;
  }

  .add-item {
    grid-column: 2;        /* center column */
    height: 64px;
    background: transparent;
    border: 2px dashed var(--text);
    border-radius: var(--radius-panel);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 20px;
    font-weight: 600;
    line-height: 24px;
    cursor: pointer;
    transition: background-color 0.15s;
  }
  .add-item:hover { background: rgba(255, 255, 255, 0.05); }

  /* ── Done button ─────────────────────────────── */
  .done-btn {
    grid-column: 3;          /* right column */
    justify-self: end;
    width: 166px;
    height: 52px;
    background: var(--green);
    border: none;
    border-radius: var(--radius-btn);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 24px;
    font-weight: 700;
    line-height: 29px;
    cursor: pointer;
    transition: filter 0.15s;
  }
  .done-btn:hover { filter: brightness(1.06); }

  /* ── Responsive ──────────────────────────────── */
  @media (max-width: 820px) {
    .items-panel { padding: 40px 40px; }
    .item-row    { gap: 40px; }
  }
  @media (max-width: 640px) {
    .navbar      { padding: 10px 18px; }
    .nav-icons   { gap: 24px; }
    .wordmark    { font-size: 20px; }
    .list-title  { font-size: 32px; line-height: 40px; margin-top: 32px; }
    .toolbar     { flex-direction: column; gap: 16px; align-items: flex-start; }
    .items-panel { padding: 28px 16px; gap: 18px; }
    .item-row    { gap: 18px; }
    .item-circle { width: 80px; height: 80px; }
    .item-name   { font-size: 18px; }
    .footer-row  {
      grid-template-columns: 1fr;
      row-gap: 16px;
    }
    .add-item    { grid-column: 1; }
    .done-btn    { grid-column: 1; justify-self: center; }
  }
</style>
</head>
<body>

  <div class="container">

    <!-- Navbar -->
    <nav class="navbar">
      <a class="wordmark" href="homepage.html">
        <span class="orange">Everything</span><span class="blue">Ranker</span>
      </a>
      <div class="nav-icons">
        <button class="icon-btn" type="button" aria-label="Profile" onclick="window.location.href='view_your_profile.html'">
          <svg class="person" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 11.9751c-1.1 0 -2 -0.35 -2.7 -1.05 -0.7 -0.7 -1.05 -1.6 -1.05 -2.7s0.35 -2 1.05 -2.7c0.7 -0.7 1.6 -1.05 2.7 -1.05s2 0.35 2.7 1.05c0.7 0.7 1.05 1.6 1.05 2.7s-0.35 2 -1.05 2.7c-0.7 0.7 -1.6 1.05 -2.7 1.05Zm-8 8.025v-2.35c0 -0.63335 0.158335 -1.175 0.475 -1.625 0.316665 -0.45 0.725 -0.79165 1.225 -1.025 1.11665 -0.5 2.1875 -0.875 3.2125 -1.125s2.05415 -0.375 3.0875 -0.375 2.05835 0.12915 3.075 0.3875c1.01665 0.25835 2.08265 0.63075 3.198 1.11725 0.52165 0.2355 0.9399 0.5769 1.25475 1.02425 0.31485 0.44735 0.47225 0.98765 0.47225 1.621v2.35H4Zm1.5 -1.5h13v-0.85c0 -0.26665 -0.07915 -0.52085 -0.2375 -0.7625 -0.15835 -0.24165 -0.35415 -0.42085 -0.5875 -0.5375 -1.06665 -0.51665 -2.04165 -0.87085 -2.925 -1.0625 -0.88335 -0.19165 -1.8 -0.2875 -2.75 -0.2875s-1.875 0.09585 -2.775 0.2875c-0.9 0.19165 -1.875 0.54585 -2.925 1.0625 -0.23335 0.11665 -0.425 0.29585 -0.575 0.5375 -0.15 0.24165 -0.225 0.49585 -0.225 0.7625v0.85Zm6.5 -8.025c0.65 0 1.1875 -0.2125 1.6125 -0.6375 0.425 -0.425 0.6375 -0.9625 0.6375 -1.6125s-0.2125 -1.1875 -0.6375 -1.6125c-0.425 -0.425 -0.9625 -0.6375 -1.6125 -0.6375s-1.1875 0.2125 -1.6125 0.6375c-0.425 0.425 -0.6375 0.9625 -0.6375 1.6125s0.2125 1.1875 0.6375 1.6125c0.425 0.425 0.9625 0.6375 1.6125 0.6375Z" stroke-width="0.5"/>
          </svg>
        </button>
        <a class="icon-btn" href="homepage.html" aria-label="Home">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true">
            <path d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z"/>
          </svg>
        </a>
      </div>
    </nav>

  </div>

  <!-- Title -->
  <h1 class="list-title">(Name of List)</h1>

  <!-- Privacy / Delete toolbar -->
  <div class="toolbar">
    <div class="privacy">
      <span>Set to Private</span>
      <button class="switch" type="button" role="switch" aria-checked="true" aria-label="Set list to private">
        <span class="switch-target">
          <span class="switch-state-layer">
            <span class="switch-handle"></span>
          </span>
        </span>
      </button>
    </div>

    <button class="delete-btn" type="button">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true">
        <path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/>
      </svg>
      <span>Delete List</span>
    </button>
  </div>

  <!-- Items panel -->
  <section class="items-panel">
    <div class="item-row">
      <div class="item-circle"></div>
      <span class="item-name">Item_01 Name</span>
    </div>
    <div class="item-row">
      <div class="item-circle"></div>
      <span class="item-name">Item_02 Name</span>
    </div>
    <div class="item-row">
      <div class="item-circle">
        <span class="plus" aria-hidden="true"></span>
      </div>
      <span class="item-name">Item_03 Name</span>
    </div>
  </section>

  <!-- Add new item + Done -->
  <div class="footer-row">
    <button class="add-item" type="button">+ Add New Item</button>
    <button class="done-btn" type="button" onclick="window.location.href='ranking.html'">Done</button>
  </div>

  <script>
    // Wire up every .switch on the page so clicking flips on/off.
    // The toggle's visual state is driven entirely by the .off class.
    document.querySelectorAll('.switch').forEach(sw => {
      sw.addEventListener('click', () => {
        const wasOn = !sw.classList.contains('off');
        sw.classList.toggle('off', wasOn);
        sw.setAttribute('aria-checked', String(!wasOn));
      });
    });
  </script>

</body>
</html>
