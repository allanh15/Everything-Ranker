<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EverythingRanker — Edit List</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #3D3D3D; --nav-bg: #1D1D1D; --card-bg: #525252;
    --orange: #F9AD60; --blue: #5097FC; --text: #FFFFFF; --icon-fill: #E3E3E3;
    --shadow-text: -4px 4px 4px rgba(0,0,0,.25); --shadow-card: 0 4px 4px rgba(0,0,0,.25);
    --radius-pill: 20px; --radius-card: 20px; --radius-btn: 18px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); min-height: 100vh; padding: 20px 20px 80px; }
  .container { max-width: 1400px; margin: 0 auto; }
  .navbar { height: 50px; background: var(--nav-bg); border-radius: var(--radius-pill); padding: 10px 35px; display: flex; justify-content: space-between; align-items: center; }
  .wordmark { font-size: 24px; font-weight: 800; text-decoration: none; text-shadow: var(--shadow-text); }
  .wordmark .orange { color: var(--orange); }
  .wordmark .blue   { color: var(--blue); }
  .nav-icons { display: flex; align-items: center; gap: 46px; }
  .icon-btn { background: none; border: none; padding: 0; cursor: pointer; display: inline-flex; align-items: center; color: var(--icon-fill); transition: opacity .15s; }
  .icon-btn:hover { opacity: .75; }
  .page-layout { display: flex; flex-direction: row; align-items: flex-start; gap: 40px; margin-top: 40px; padding: 0 15px; }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; padding: 0; cursor: pointer; color: var(--text); font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 500; text-decoration: none; flex-shrink: 0; transition: opacity .15s; }
  .back-btn:hover { opacity: .85; }
  .back-btn svg { fill: var(--icon-fill); }
  .card { flex: 1; max-width: 742px; background: var(--card-bg); box-shadow: var(--shadow-card); border-radius: var(--radius-card); padding: 50px 60px 60px; }
  .title-row { display: flex; align-items: center; gap: 16px; margin-bottom: 36px; }
  .list-title-input { flex: 1; background: none; border: none; border-bottom: 2px solid var(--text); color: var(--text); font-family: 'Inter', sans-serif; font-size: 32px; font-weight: 600; padding: 4px 0; outline: none; }
  .privacy-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 36px; }
  .privacy-label { font-size: 24px; font-weight: 600; }
  .toggle { appearance: none; -webkit-appearance: none; width: 52px; height: 32px; background: var(--orange); border-radius: 100px; position: relative; cursor: pointer; border: none; transition: background .2s; }
  .toggle::before { content: ''; position: absolute; top: 50%; right: 4px; transform: translateY(-50%); width: 24px; height: 24px; background: #FFF; border-radius: 50%; transition: all .2s; }
  .toggle:not(:checked) { background: #888; }
  .toggle:not(:checked)::before { right: calc(100% - 28px); }
  .add-item-row { display: flex; gap: 12px; margin-bottom: 24px; }
  .item-input { flex: 1; height: 44px; border-radius: 10px; border: none; background: #3D3D3D; color: var(--text); font-family: 'Inter', sans-serif; font-size: 18px; padding: 0 14px; outline: none; }
  .item-input:focus { box-shadow: 0 0 0 2px var(--orange); }
  .btn-add { height: 44px; padding: 0 24px; background: var(--orange); border: none; border-radius: 10px; color: #000; font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 700; cursor: pointer; transition: filter .15s; white-space: nowrap; }
  .btn-add:hover { filter: brightness(1.05); }
  .items-list { display: flex; flex-direction: column; gap: 10px; }
  .item-row { display: flex; align-items: center; justify-content: space-between; background: #3D3D3D; border-radius: 10px; padding: 10px 16px; }
  .item-name { font-size: 20px; font-weight: 600; }
  .btn-remove { background: none; border: none; cursor: pointer; color: #ff7070; font-size: 20px; font-weight: 700; line-height: 1; padding: 0 4px; transition: opacity .15s; }
  .btn-remove:hover { opacity: .75; }
  .action-row { display: flex; gap: 16px; margin-top: 36px; flex-wrap: wrap; }
  .btn-save { flex: 1; height: 49px; background: var(--orange); border: none; border-radius: var(--radius-btn); color: #000; font-family: 'Inter', sans-serif; font-size: 22px; font-weight: 800; cursor: pointer; transition: filter .15s; }
  .btn-save:hover { filter: brightness(1.05); }
  .btn-delete { height: 49px; padding: 0 28px; background: none; border: 2px solid #ff7070; border-radius: var(--radius-btn); color: #ff7070; font-family: 'Inter', sans-serif; font-size: 22px; font-weight: 700; cursor: pointer; transition: opacity .15s; }
  .btn-delete:hover { opacity: .75; }
  .btn-rank { flex: 1; height: 49px; background: var(--blue); border: none; border-radius: var(--radius-btn); color: #fff; font-family: 'Inter', sans-serif; font-size: 22px; font-weight: 800; cursor: pointer; transition: filter .15s; }
  .btn-rank:hover { filter: brightness(1.1); }
  .error-msg { color: #ff7070; font-size: 15px; font-weight: 600; margin-top: 8px; }
  @media(max-width:720px){ .page-layout { flex-direction: column; } .card { padding: 36px 24px 48px; } }
</style>
</head>
<body>
<div class="container">
  <nav class="navbar">
    <a class="wordmark" href="homepage.html"><span class="orange">Everything</span><span class="blue">Ranker</span></a>
    <div class="nav-icons">
      <button class="icon-btn" type="button" aria-label="Profile" onclick="window.location.href='view_your_profile.html'">
        <svg xmlns="http://www.w3.org/2000/svg" height="24" width="24" viewBox="0 -960 960 960" fill="currentColor"><path d="M480-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Zm80-80h480v-32q0-11-5.5-20T700-306q-54-27-109-40.5T480-360q-56 0-111 13.5T260-306q-9 5-14.5 14t-5.5 20v32Zm240-320q33 0 56.5-23.5T560-640q0-33-23.5-56.5T480-720q-33 0-56.5 23.5T400-640q0 33 23.5 56.5T480-560Zm0-80Zm0 400Z"/></svg>
      </button>
      <button class="icon-btn" type="button" aria-label="Home" onclick="window.location.href='homepage.html'">
        <svg xmlns="http://www.w3.org/2000/svg" height="24" width="24" viewBox="0 -960 960 960" fill="currentColor"><path d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z"/></svg>
      </button>
    </div>
  </nav>

  <div class="page-layout">
    <a class="back-btn" href="view_your_profile.html">
      <svg xmlns="http://www.w3.org/2000/svg" height="24" width="24" viewBox="0 -960 960 960"><path d="m313-440 224 224-57 56-320-320 320-320 57 56-224 224h487v80H313Z"/></svg>
      Back
    </a>

    <div class="card">
      <div class="title-row">
        <input class="list-title-input" id="list-title" type="text" placeholder="List title…" maxlength="80" />
      </div>
      <div class="privacy-row">
        <span class="privacy-label">Public</span>
        <input class="toggle" id="privacy-toggle" type="checkbox" aria-label="Public" />
      </div>
      <div class="add-item-row">
        <input class="item-input" id="new-item" type="text" placeholder="Add an item…" maxlength="100" />
        <button class="btn-add" id="add-item-btn">Add</button>
      </div>
      <div class="items-list" id="items-list"></div>
      <p class="error-msg" id="error-msg"></p>
      <div class="action-row">
        <button class="btn-save" id="save-btn">Save</button>
        <button class="btn-rank" id="rank-btn">Rank This List</button>
        <button class="btn-delete" id="delete-btn" style="display:none">Delete List</button>
      </div>
    </div>
  </div>
</div>

<script src="api.js"></script>
<script>
  const user = requireAuth();
  if (!user) throw new Error('not logged in');

  const params = new URLSearchParams(window.location.search);
  const listId = params.get('listId') ? parseInt(params.get('listId')) : null;
  const isNew = params.get('new') === '1';

  let items = [];

  function renderItems() {
    const el = document.getElementById('items-list');
    el.innerHTML = '';
    items.forEach((name, i) => {
      const row = document.createElement('div');
      row.className = 'item-row';
      row.innerHTML = `<span class="item-name">${name}</span><button class="btn-remove" data-i="${i}" title="Remove">✕</button>`;
      el.appendChild(row);
    });
    el.querySelectorAll('.btn-remove').forEach(btn => {
      btn.addEventListener('click', () => {
        items.splice(parseInt(btn.dataset.i), 1);
        renderItems();
      });
    });
  }

  async function loadList() {
    if (!listId) return;
    const res = await apiFetch('/lists/' + listId);
    if (!res.success) { document.getElementById('error-msg').textContent = 'List not found.'; return; }
    const list = res.data;
    document.getElementById('list-title').value = list.title;
    document.getElementById('privacy-toggle').checked = list.isPublic;
    items = list.items || [];
    renderItems();
    if (list.authorId === user.userId) document.getElementById('delete-btn').style.display = 'inline-flex';
  }

  document.getElementById('add-item-btn').addEventListener('click', () => {
    const input = document.getElementById('new-item');
    const name = input.value.trim();
    if (!name) return;
    if (items.includes(name)) { document.getElementById('error-msg').textContent = 'Item already in list.'; return; }
    items.push(name);
    input.value = '';
    document.getElementById('error-msg').textContent = '';
    renderItems();
  });
  document.getElementById('new-item').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('add-item-btn').click(); });

  document.getElementById('save-btn').addEventListener('click', async () => {
    const title = document.getElementById('list-title').value.trim();
    const isPublic = document.getElementById('privacy-toggle').checked;
    const errEl = document.getElementById('error-msg');
    errEl.textContent = '';
    if (!title) { errEl.textContent = 'Title is required.'; return; }

    let listRes;
    if (isNew || !listId) {
      listRes = await apiFetch('/lists', {
        method: 'POST',
        body: JSON.stringify({ title, authorId: user.userId, isPublic })
      });
      if (!listRes.success) { errEl.textContent = listRes.message; return; }
      const newId = listRes.data.listId;
      for (const item of items) {
        await apiFetch(`/lists/${newId}/items`, { method: 'POST', body: JSON.stringify({ itemName: item }) });
      }
      window.location.href = `edit_list.html?listId=${newId}`;
    } else {
      listRes = await apiFetch(`/lists/${listId}`, {
        method: 'PUT',
        body: JSON.stringify({ userId: user.userId, title, isPublic })
      });
      if (!listRes.success) { errEl.textContent = listRes.message; return; }
      // Re-sync items: fetch current, add new, (no delete for now)
      const currentRes = await apiFetch(`/lists/${listId}/items`);
      const currentItems = currentRes.success ? currentRes.data : [];
      for (const item of items) {
        if (!currentItems.includes(item)) {
          await apiFetch(`/lists/${listId}/items`, { method: 'POST', body: JSON.stringify({ itemName: item }) });
        }
      }
      errEl.style.color = '#6fff6f';
      errEl.textContent = 'Saved!';
      setTimeout(() => { errEl.textContent = ''; errEl.style.color = ''; }, 2000);
    }
  });

  document.getElementById('rank-btn').addEventListener('click', async () => {
    if (isNew || !listId) {
      document.getElementById('error-msg').textContent = 'Save the list first.';
      return;
    }
    window.location.href = `ranking.html?listId=${listId}`;
  });

  document.getElementById('delete-btn').addEventListener('click', async () => {
    if (!confirm('Delete this list? This cannot be undone.')) return;
    const res = await apiFetch(`/lists/${listId}?userId=${user.userId}`, { method: 'DELETE' });
    if (res.success) window.location.href = 'view_your_profile.html';
    else document.getElementById('error-msg').textContent = res.message;
  });

  loadList();
</script>
</body>
</html>
