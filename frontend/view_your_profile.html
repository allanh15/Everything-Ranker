<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EverythingRanker — Your Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #3D3D3D; --nav-bg: #1D1D1D; --card-bg: #525252;
    --orange: #F9AD60; --blue: #5097FC; --text: #FFFFFF; --icon-fill: #E3E3E3;
    --shadow-text: -4px 4px 4px rgba(0,0,0,.25); --shadow-card: 0 4px 4px rgba(0,0,0,.25);
    --radius-pill: 20px; --radius-card: 20px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); min-height: 100vh; padding: 20px 20px 82px; }
  .container { max-width: 1400px; margin: 0 auto; }
  .navbar { height: 50px; background: var(--nav-bg); border-radius: var(--radius-pill); padding: 10px 35px; display: flex; justify-content: space-between; align-items: center; }
  .wordmark { font-size: 24px; font-weight: 800; text-decoration: none; text-shadow: var(--shadow-text); }
  .wordmark .orange { color: var(--orange); }
  .wordmark .blue   { color: var(--blue); }
  .icon-btn { background: none; border: none; padding: 0; cursor: pointer; display: inline-flex; align-items: center; color: var(--icon-fill); transition: opacity .15s; }
  .icon-btn:hover { opacity: .75; }
  .profile-header { margin-top: 52px; display: grid; grid-template-columns: 1fr 1fr; align-items: center; max-width: 1100px; margin-left: auto; margin-right: auto; padding: 0 80px; }
  .profile-avatar { display: flex; flex-direction: column; align-items: center; gap: 18px; justify-self: center; }
  .profile-avatar .avatar-icon svg { width: 200px; height: 200px; display: block; fill: var(--icon-fill); }
  .settings-btn { display: inline-flex; align-items: center; gap: 8px; background: none; border: none; padding: 0; cursor: pointer; color: var(--text); font-family: 'Inter', sans-serif; font-size: 22px; font-weight: 700; transition: opacity .15s; }
  .settings-btn:hover { opacity: .85; }
  .settings-btn svg { fill: var(--icon-fill); }
  .profile-name { display: flex; flex-direction: column; align-items: center; gap: 30px; justify-self: center; }
  .profile-name .username { font-size: 48px; font-weight: 600; text-align: center; }
  .profile-columns { margin-top: 36px; display: grid; grid-template-columns: 1fr 1fr; max-width: 1100px; margin-left: auto; margin-right: auto; padding: 0 80px; }
  .profile-card { display: flex; flex-direction: column; align-items: center; width: 360px; max-width: 100%; justify-self: center; }
  .profile-card .card-heading { font-size: 48px; font-weight: 600; text-align: center; margin-bottom: 4px; }
  .profile-card.lists .card-heading { color: var(--orange); }
  .profile-card.ranks .card-heading { color: var(--blue); }
  .card-box { width: 100%; background: var(--card-bg); box-shadow: var(--shadow-card); border-radius: var(--radius-card); padding: 48px 40px; display: flex; flex-direction: column; align-items: center; min-height: 280px; }
  .card-list { display: flex; flex-direction: column; align-items: center; gap: 24px; width: 100%; }
  .card-list a { color: var(--text); font-size: 20px; font-weight: 600; text-decoration: underline; text-align: center; cursor: pointer; transition: opacity .15s; }
  .card-list a:hover { opacity: .85; }
  .empty-card { color: rgba(255,255,255,.4); font-size: 16px; text-align: center; }
  @media(max-width:1080px){ .profile-header { padding: 0 24px; } .profile-columns { padding: 0 24px; } }
  @media(max-width:720px){
    .navbar { padding: 10px 18px; }
    .profile-header { grid-template-columns: 1fr; row-gap: 24px; }
    .profile-columns { grid-template-columns: 1fr; row-gap: 24px; }
    .profile-avatar .avatar-icon svg { width: 140px; height: 140px; }
    .profile-name .username { font-size: 36px; }
    .profile-card .card-heading { font-size: 36px; }
  }
</style>
</head>
<body>
<div class="container">
  <nav class="navbar">
    <a class="wordmark" href="homepage.html"><span class="orange">Everything</span><span class="blue">Ranker</span></a>
    <button class="icon-btn" type="button" aria-label="Home" onclick="window.location.href='homepage.html'">
      <svg xmlns="http://www.w3.org/2000/svg" height="24" width="24" viewBox="0 -960 960 960" fill="currentColor"><path d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z"/></svg>
    </button>
  </nav>

  <section class="profile-header">
    <div class="profile-avatar">
      <div class="avatar-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M234-276q51-39 114-61.5T480-360q69 0 132 22.5T726-276q35-41 54.5-93T800-480q0-133-93.5-226.5T480-800q-133 0-226.5 93.5T160-480q0 59 19.5 111t54.5 93Zm146.5-204.5Q340-521 340-580t40.5-99.5Q421-720 480-720t99.5 40.5Q620-639 620-580t-40.5 99.5Q539-440 480-440t-99.5-40.5ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm100-95.5q47-15.5 86-44.5-39-29-86-44.5T480-280q-53 0-100 15.5T294-220q39 29 86 44.5T480-160q53 0 100-15.5ZM523-537q17-17 17-43t-17-43q-17-17-43-17t-43 17q-17 17-17 43t17 43q17 17 43 17t43-17Zm-43-43Zm0 360Z"/></svg>
      </div>
      <button class="settings-btn" type="button" onclick="window.location.href='settings.html'">
        <svg xmlns="http://www.w3.org/2000/svg" height="24" width="24" viewBox="0 -960 960 960"><path d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm70-80h79l14-106q31-8 57.5-23.5T639-327l99 41 39-68-86-65q5-14 7-29.5t2-31.5q0-16-2-31.5t-7-29.5l86-65-39-68-99 42q-22-23-48.5-38.5T533-694l-13-106h-79l-14 106q-31 8-57.5 23.5T321-633l-99-41-39 68 86 64q-5 15-7 30t-2 32q0 16 2 31t7 30l-86 65 39 68 99-42q22 23 48.5 38.5T427-266l13 106Zm42-180q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Zm-2-140Z"/></svg>
        Settings
      </button>
    </div>

    <div class="profile-name">
      <h1 class="username" id="username">Loading…</h1>
    </div>
  </section>

  <section class="profile-columns">
    <div class="profile-card lists">
      <h2 class="card-heading">My Lists</h2>
      <div class="card-box">
        <div class="card-list" id="lists-el"></div>
      </div>
    </div>

    <div class="profile-card ranks">
      <h2 class="card-heading">My Ranks</h2>
      <div class="card-box">
        <div class="card-list" id="ranks-el"></div>
      </div>
    </div>
  </section>
</div>

<script src="api.js"></script>
<script>
  const user = requireAuth();
  if (!user) throw new Error('not logged in');

  document.getElementById('username').textContent = user.username;

  async function load() {
    const [listsRes, ranksRes] = await Promise.all([
      apiFetch('/lists/user/' + user.userId),
      apiFetch('/rank/user/' + user.userId)
    ]);

    const listsEl = document.getElementById('lists-el');
    const ranksEl = document.getElementById('ranks-el');

    if (listsRes.success && listsRes.data.length) {
      listsRes.data.forEach(list => {
        const a = document.createElement('a');
        a.href = `edit_list.html?listId=${list.id}`;
        a.textContent = list.title;
        listsEl.appendChild(a);
      });
    } else {
      listsEl.innerHTML = '<p class="empty-card">No lists yet.<br><a href="edit_list.html?new=1" style="color:inherit">Create one!</a></p>';
    }

    if (ranksRes.success && ranksRes.data.rankings.length) {
      ranksRes.data.rankings.forEach(r => {
        const a = document.createElement('a');
        a.href = `view_your_ranked_list.html?listId=${r.id}&userId=${user.userId}`;
        a.textContent = r.title;
        ranksEl.appendChild(a);
      });
    } else {
      ranksEl.innerHTML = '<p class="empty-card">No rankings yet.</p>';
    }
  }

  load();
</script>
</body>
</html>
