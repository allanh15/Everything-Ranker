<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EverythingRanker — Ranking</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* ── Design Tokens ───────────────────────────── */
  :root {
    --bg:          #3D3D3D;
    --nav-bg:      #1D1D1D;
    --orange:      #F9AD60;
    --blue:        #71A5FF;        /* wordmark blue */
    --card-blue:   #5097FC;        /* right-side big card */
    --inner-gray:  #6A6866;        /* inner image card */
    --text:        #FFFFFF;
    --text-muted:  rgba(255, 255, 255, 0.5);
    --icon-fill:   #E3E3E3;

    --shadow-text: 4px 4px 4px rgba(0, 0, 0, 0.25);
    --shadow-text-l: -4px 4px 4px rgba(0, 0, 0, 0.25);
    --shadow-card: -6px 6px 6px rgba(0, 0, 0, 0.25);

    --radius-pill: 20px;
    --radius-card: 25px;
  }

  /* ── Reset ───────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--text);
    min-height: 100vh;
    padding: 20px 20px 90px;
  }

  .container {
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* ── Navbar ──────────────────────────────────── */
  .navbar {
    width: 100%;
    height: 50px;
    background: var(--nav-bg);
    border-radius: var(--radius-pill);
    padding: 10px 35px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .wordmark {
    font-size: 24px;
    font-weight: 800;
    line-height: 29px;
    text-decoration: none;
    text-shadow: var(--shadow-text-l);
  }
  .wordmark .orange { color: var(--orange); }
  .wordmark .blue   { color: var(--blue); }

  .nav-icons {
    display: flex;
    align-items: center;
    gap: 46px;
  }

  .icon-btn {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--icon-fill);
    transition: opacity 0.15s;
  }
  .icon-btn:hover { opacity: 0.75; }
  .icon-btn svg   { display: block; }
  .icon-btn .person path { fill: var(--icon-fill); }

  /* ── Top toolbar (undo / heading / next) ─────── */
  .toolbar {
    margin-top: 31px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: start;
    column-gap: 24px;
  }

  .nav-action {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 19px;
    transition: opacity 0.15s;
  }
  .nav-action:hover { opacity: 0.75; }
  .nav-action svg   { width: 30px; height: 30px; display: block; }

  .nav-action.right { align-items: flex-end; justify-self: end; }

  .heading {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .heading .sub {
    font-size: 20px;
    font-weight: 500;
    line-height: 24px;
    color: var(--text);
  }
  .heading .title {
    font-size: 48px;
    font-weight: 600;
    line-height: 58px;
    color: var(--text);
    text-shadow: var(--shadow-text);
    white-space: nowrap;
  }

  /* ── Main comparison area ────────────────────── */
  .compare {
    display: grid;
    grid-template-columns: 420px auto 420px;
    align-items: center;
    justify-content: center;
    column-gap: 128px;
    margin-top: 30px;
  }

  .vs {
    font-size: 36px;
    font-weight: 800;
    line-height: 44px;
    color: var(--text);
    text-shadow: var(--shadow-text);
    text-align: center;
  }

  .item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 29px;
  }

  .item-label {
    font-size: 20px;
    font-weight: 600;
    line-height: 24px;
    color: var(--text);
    text-align: center;
  }

  /* Outer colored card; inner gray card layered on top */
  .card {
    position: relative;
    width: 420px;
    height: 560px;
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    cursor: pointer;
    transition: transform 0.18s ease, filter 0.18s ease;
  }
  .card:hover    { transform: translateY(-2px); filter: brightness(1.04); }
  .card.orange   { background: var(--orange); }
  .card.blue     { background: var(--card-blue); }

  /* Inner gray "image" card — centered in outer colored card.
     Pixel-measured from screenshot: 61px vertical gap, 66px horizontal gap.
     The visual top-bias illusion is caused by the drop shadow on the bottom-right. */
  .card-inner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 290px;
    height: 440px;
    background: var(--inner-gray);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 600;
    line-height: 24px;
    color: var(--text);
  }

  .skip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 20px;
    font-weight: 600;
    line-height: 24px;
    color: var(--text-muted);
    transition: color 0.15s;
  }
  .skip:hover { color: var(--text); }
  .skip svg   { display: block; color: var(--icon-fill); }

  /* ── Skip both (bottom centered) ─────────────── */
  .skip-both-row {
    display: flex;
    justify-content: center;
    margin-top: 14px;
  }

  /* ── Responsive ──────────────────────────────── */
  @media (max-width: 1100px) {
    .compare { column-gap: 48px; }
  }
  @media (max-width: 920px) {
    .compare {
      grid-template-columns: 1fr;
      row-gap: 32px;
      column-gap: 0;
    }
    .vs { order: 0; }
  }
  @media (max-width: 720px) {
    .navbar     { padding: 10px 18px; }
    .nav-icons  { gap: 24px; }
    .wordmark   { font-size: 20px; }
    .heading .title { font-size: 36px; line-height: 44px; }
    .card       { width: 320px; height: 426px; }
    .card-inner { width: 220px; height: 334px; }
  }
</style>
</head>
<body>

  <div class="container">

    <!-- Navbar -->
    <nav class="navbar">
      <a class="wordmark" href="homepage.html">
        <span class="orange">Everything</span><span class="blue">Ranker</span>
      </a>
      <div class="nav-icons">
        <button class="icon-btn" type="button" aria-label="Profile" onclick="window.location.href='view_your_profile.html'">
          <!-- Person — Streamline Outlined Material Symbols -->
          <svg class="person" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 11.9751c-1.1 0 -2 -0.35 -2.7 -1.05 -0.7 -0.7 -1.05 -1.6 -1.05 -2.7s0.35 -2 1.05 -2.7c0.7 -0.7 1.6 -1.05 2.7 -1.05s2 0.35 2.7 1.05c0.7 0.7 1.05 1.6 1.05 2.7s-0.35 2 -1.05 2.7c-0.7 0.7 -1.6 1.05 -2.7 1.05Zm-8 8.025v-2.35c0 -0.63335 0.158335 -1.175 0.475 -1.625 0.316665 -0.45 0.725 -0.79165 1.225 -1.025 1.11665 -0.5 2.1875 -0.875 3.2125 -1.125s2.05415 -0.375 3.0875 -0.375 2.05835 0.12915 3.075 0.3875c1.01665 0.25835 2.08265 0.63075 3.198 1.11725 0.52165 0.2355 0.9399 0.5769 1.25475 1.02425 0.31485 0.44735 0.47225 0.98765 0.47225 1.621v2.35H4Zm1.5 -1.5h13v-0.85c0 -0.26665 -0.07915 -0.52085 -0.2375 -0.7625 -0.15835 -0.24165 -0.35415 -0.42085 -0.5875 -0.5375 -1.06665 -0.51665 -2.04165 -0.87085 -2.925 -1.0625 -0.88335 -0.19165 -1.8 -0.2875 -2.75 -0.2875s-1.875 0.09585 -2.775 0.2875c-0.9 0.19165 -1.875 0.54585 -2.925 1.0625 -0.23335 0.11665 -0.425 0.29585 -0.575 0.5375 -0.15 0.24165 -0.225 0.49585 -0.225 0.7625v0.85Zm6.5 -8.025c0.65 0 1.1875 -0.2125 1.6125 -0.6375 0.425 -0.425 0.6375 -0.9625 0.6375 -1.6125s-0.2125 -1.1875 -0.6375 -1.6125c-0.425 -0.425 -0.9625 -0.6375 -1.6125 -0.6375s-1.1875 0.2125 -1.6125 0.6375c-0.425 0.425 -0.6375 0.9625 -0.6375 1.6125s0.2125 1.1875 0.6375 1.6125c0.425 0.425 0.9625 0.6375 1.6125 0.6375Z" stroke-width="0.5"/>
          </svg>
        </button>
        <a class="icon-btn" href="homepage.html" aria-label="Home">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true">
            <path d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z"/>
          </svg>
        </a>
      </div>
    </nav>

    <!-- Toolbar: undo / heading / next -->
    <div class="toolbar">
      <button class="nav-action left" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true">
          <path d="M280-200v-80h284q63 0 109.5-40T720-420q0-60-46.5-100T564-560H312l104 104-56 56-200-200 200-200 56 56-104 104h252q97 0 166.5 63T800-420q0 94-69.5 157T564-200H280Z"/>
        </svg>
        <span>undo</span>
      </button>

      <div class="heading">
        <span class="sub">You are ranking [list name]</span>
        <span class="title">Select One</span>
      </div>

      <button class="nav-action right" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true">
          <path d="M647-440H160v-80h487L423-744l57-56 320 320-320 320-57-56 224-224Z"/>
        </svg>
        <span>next</span>
      </button>
    </div>

  </div>

  <!-- Comparison area -->
  <section class="compare">

    <div class="item">
      <span class="item-label">[Name of Item]</span>
      <div class="card orange" role="button" tabindex="0" aria-label="Select left item">
        <div class="card-inner">[Image]</div>
      </div>
      <button class="skip" type="button">
        <span>skip</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true">
          <path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/>
        </svg>
      </button>
    </div>

    <div class="vs">vs</div>

    <div class="item">
      <span class="item-label">[Name of Item]</span>
      <div class="card blue" role="button" tabindex="0" aria-label="Select right item">
        <div class="card-inner">[Image]</div>
      </div>
      <button class="skip" type="button">
        <span>skip</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true">
          <path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/>
        </svg>
      </button>
    </div>

  </section>

  <!-- Skip both -->
  <div class="skip-both-row">
    <button class="skip" type="button">
      <span>skip both</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true">
        <path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/>
      </svg>
    </button>
  </div>

</body>
</html>
