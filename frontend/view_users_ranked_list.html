<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EverythingRanker — user_0001's Final Ranking</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* ── Design Tokens ───────────────────────────── */
  :root {
    --bg:           #3D3D3D;
    --nav-bg:       #1D1D1D;
    --row-light:    #6A6866;
    --row-dark:     #525252;
    --orange:       #F9AD60;
    --blue:         #71A5FF;
    --text:         #FFFFFF;
    --item-text:    #000000;
    --icon-fill:    #E3E3E3;

    /* Medal border colors */
    --gold:         #FCC417;
    --silver:       #CECDD2;
    --bronze:       #D25116;

    /* Outline button */
    --outline-bg:    rgba(0, 0, 0, 0.16);
    --outline-stroke: rgba(255, 255, 255, 0.26);
    --outline-text:  rgba(255, 255, 255, 0.54);
    --outline-icon:  rgba(227, 227, 227, 0.5);

    --shadow-text:    -4px 4px 4px rgba(0, 0, 0, 0.25);

    --radius-pill:    20px;
    --radius-row:     10px;
    --radius-btn:     18px;
    --radius-share:   42px;
  }

  /* ── Reset ───────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--text);
    min-height: 100vh;
    padding: 20px 20px 36px;
  }

  .container {
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* ── Navbar ──────────────────────────────────── */
  .navbar {
    width: 100%;
    height: 50px;
    background: var(--nav-bg);
    border-radius: var(--radius-pill);
    padding: 10px 35px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .nav-left,
  .nav-right {
    display: flex;
    align-items: center;
  }

  .nav-left {
    gap: 50px;
  }

  .nav-right {
    gap: 46px;
  }

  .wordmark {
    font-size: 24px;
    font-weight: 800;
    line-height: 29px;
    text-decoration: none;
    text-shadow: var(--shadow-text);
  }
  .wordmark .orange { color: var(--orange); }
  .wordmark .blue   { color: var(--blue); }

  .icon-btn {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--icon-fill);
    transition: opacity 0.15s;
  }
  .icon-btn:hover { opacity: 0.75; }
  .icon-btn svg   { display: block; }
  .icon-btn .person path { fill: var(--icon-fill); }

  /* ── Top action row (back / heading / actions) ── */
  /* Sits inside .container so back and actions align with navbar edges */
  .top-row {
    margin-top: 31px;
    padding: 0 35px;     /* match navbar inner padding so columns align with header */
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: start;
    column-gap: 24px;
  }

  .nav-action {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 500;
    line-height: 19px;
    text-decoration: none;
    transition: opacity 0.15s;
    justify-self: start;
  }
  .nav-action:hover { opacity: 0.75; }
  .nav-action svg   { width: 30px; height: 30px; display: block; color: var(--icon-fill); }

  .heading {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .heading .title {
    font-size: 36px;
    font-weight: 600;
    line-height: 44px;
    color: var(--text);
    white-space: nowrap;
  }
  .heading .subtitle {
    font-size: 24px;
    font-weight: 400;
    line-height: 29px;
    color: var(--text);
  }

  .actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    justify-self: end;
  }

  .pill-outline {
    height: 44px;
    background: var(--outline-bg);
    border: 2px solid var(--outline-stroke);
    border-radius: 999px;        /* fully rounded pill */
    padding: 10px 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--outline-text);
    font-family: 'Inter', sans-serif;
    font-size: 20px;
    font-weight: 500;
    line-height: 24px;
    cursor: pointer;
    transition: filter 0.15s;
    white-space: nowrap;
  }
  .pill-outline:hover { filter: brightness(1.2); }

  .toggle-row {
    width: 100%;
    height: 48px;
    padding: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 20px;
    font-weight: 500;
    line-height: 24px;
  }

  .toggle {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    color: var(--icon-fill);
    display: inline-flex;
    align-items: center;
    transition: opacity 0.15s;
  }
  .toggle:hover { opacity: 0.8; }
  .toggle svg { width: 28px; height: 28px; display: block; }
  /* Toggle off: flip horizontally so the knob is on the left */
  .toggle.off svg { transform: scaleX(-1); }

  /* ── List of ranked items ────────────────────── */
  .ranked-list {
    width: 800px;
    max-width: 100%;
    margin: 35px auto 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .item {
    height: 80px;
    border-radius: var(--radius-row);
    padding: 0;            /* outer wrapper has no inner padding */
    list-style: none;
  }

  /* Alternating backgrounds (default rows: solid color, no textured border) */
  .item:nth-child(odd)  .item-inner { background-color: var(--row-light); }
  .item:nth-child(even) .item-inner { background-color: var(--row-dark); }

  /* Plain (non-medal) items: just show the inner directly, no outer texture */
  .item:not(.gold):not(.silver):not(.bronze) {
    background: transparent;
  }

  .item-inner {
    width: 100%;
    height: 100%;
    border-radius: 7px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 20px;
  }
  /* Plain items: the inner is full-height since there's no outer padding */
  .item:not(.gold):not(.silver):not(.bronze) .item-inner {
    height: 80px;
    padding: 0 20px;
    border-radius: var(--radius-row);
  }

  .medal {
    width: 55px;
    height: 55px;
    flex-shrink: 0;
    display: block;
  }

  .item-name {
    font-size: 32px;
    font-weight: 600;
    line-height: 39px;
    color: var(--item-text);
  }

  /* ── Re-rank CTA ─────────────────────────────── */
  .cta-row {
    display: flex;
    justify-content: center;
    margin-top: 35px;
  }

  .cta {
    background: var(--orange);
    color: #1E1E1E;
    border: none;
    padding: 10px 18px;
    border-radius: var(--radius-btn);
    font-family: 'Inter', sans-serif;
    font-size: 20px;
    font-weight: 600;
    line-height: 24px;
    cursor: pointer;
    height: 44px;
    transition: filter 0.15s;
  }
  .cta:hover { filter: brightness(1.06); }

  /* ── Share button (bottom-right corner) ──────── */
  .share-btn {
    position: fixed;
    right: 48px;
    bottom: 36px;
    width: 144px;
    height: 44px;
    background: var(--outline-bg);
    border: 2px solid var(--outline-stroke);
    border-radius: var(--radius-share);
    padding: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--outline-text);
    font-family: 'Inter', sans-serif;
    font-size: 20px;
    font-weight: 500;
    line-height: 24px;
    cursor: pointer;
    transition: filter 0.15s;
  }
  .share-btn:hover { filter: brightness(1.3); }
  .share-btn svg   { width: 24px; height: 24px; display: block; opacity: 0.5; }

  /* ── Responsive ──────────────────────────────── */
  @media (max-width: 920px) {
    .top-row {
      grid-template-columns: auto 1fr auto;
    }
  }
  @media (max-width: 720px) {
    .navbar    { padding: 10px 18px; }
    .nav-right { gap: 24px; }
    .wordmark  { font-size: 20px; }
    .top-row   {
      grid-template-columns: 1fr;
      row-gap: 24px;
    }
    .heading .title    { font-size: 28px; line-height: 36px; }
    .heading .subtitle { font-size: 18px; line-height: 22px; }
    .actions   { justify-self: center; }
    .item-name { font-size: 22px; line-height: 28px; }
    .item      { padding: 0 14px; gap: 12px; }
    .medal     { width: 44px; height: 44px; }
    .share-btn { right: 16px; bottom: 16px; }
  }
</style>
