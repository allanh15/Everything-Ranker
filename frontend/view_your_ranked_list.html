<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EverythingRanker — Your Final Ranking</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #3D3D3D; --nav-bg: #1D1D1D; --row-light: #6A6866; --row-dark: #525252;
    --orange: #F9AD60; --blue: #71A5FF; --text: #FFFFFF; --item-text: #000000; --icon-fill: #E3E3E3;
    --gold: #FCC417; --silver: #CECDD2; --bronze: #D25116;
    --shadow-text: -4px 4px 4px rgba(0,0,0,.25);
    --radius-pill: 20px; --radius-row: 10px; --radius-btn: 18px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); min-height: 100vh; padding: 20px 20px 36px; }
  .container { max-width: 1400px; margin: 0 auto; }
  .navbar { height: 50px; background: var(--nav-bg); border-radius: var(--radius-pill); padding: 10px 35px; display: flex; justify-content: space-between; align-items: center; }
  .nav-left { display: flex; align-items: center; gap: 50px; }
  .nav-right { display: flex; align-items: center; gap: 46px; }
  .wordmark { font-size: 24px; font-weight: 800; text-decoration: none; text-shadow: var(--shadow-text); }
  .wordmark .orange { color: var(--orange); }
  .wordmark .blue   { color: var(--blue); }
  .icon-btn { background: none; border: none; padding: 0; cursor: pointer; display: inline-flex; align-items: center; color: var(--icon-fill); transition: opacity .15s; }
  .icon-btn:hover { opacity: .75; }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; padding: 0; cursor: pointer; color: var(--text); font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 500; transition: opacity .15s; }
  .back-btn:hover { opacity: .85; }
  .back-btn svg { fill: var(--icon-fill); }
  .page-title { margin-top: 40px; text-align: center; font-size: 48px; font-weight: 600; }
  .ranked-list { margin-top: 48px; max-width: 700px; margin-left: auto; margin-right: auto; list-style: none; display: flex; flex-direction: column; gap: 12px; counter-reset: rank; }
  .ranked-list li { counter-increment: rank; display: flex; align-items: center; gap: 16px; background: var(--row-light); border-radius: var(--radius-row); padding: 12px 24px; font-size: 20px; font-weight: 600; color: var(--item-text); position: relative; }
  .ranked-list li:nth-child(even) { background: var(--row-dark); }
  .rank-num { font-size: 18px; font-weight: 700; color: var(--item-text); min-width: 32px; }
  .medal { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .medal-gold   { background: var(--gold); }
  .medal-silver { background: var(--silver); }
  .medal-bronze { background: var(--bronze); color: #fff; }
  .item-label { flex: 1; color: var(--item-text); }
  .ranked-list li:nth-child(even) .item-label,
  .ranked-list li:nth-child(even) .rank-num { color: var(--text); }
  .cta-row { margin-top: 48px; display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; }
  .cta { height: 49px; padding: 0 28px; background: var(--orange); border: none; border-radius: var(--radius-btn); color: #000; font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 800; cursor: pointer; transition: filter .15s; }
  .cta:hover { filter: brightness(1.05); }
  .cta-outline { background: none; border: 2px solid var(--orange); color: var(--orange); }
  .empty-msg { text-align: center; color: rgba(255,255,255,.5); padding: 40px 0; font-size: 20px; }
  @media(max-width:720px){ .page-title { font-size: 32px; } .navbar { padding: 10px 18px; } }
</style>
</head>
<body>
<div class="container">
  <nav class="navbar">
    <div class="nav-left">
      <a class="wordmark" href="homepage.html"><span class="orange">Everything</span><span class="blue">Ranker</span></a>
      <button class="back-btn" id="back-btn">
        <svg xmlns="http://www.w3.org/2000/svg" height="22" width="22" viewBox="0 -960 960 960"><path d="m313-440 224 224-57 56-320-320 320-320 57 56-224 224h487v80H313Z"/></svg>
        Back
      </button>
    </div>
    <div class="nav-right">
      <button class="icon-btn" type="button" aria-label="Profile" onclick="window.location.href='view_your_profile.html'">
        <svg xmlns="http://www.w3.org/2000/svg" height="24" width="24" viewBox="0 -960 960 960" fill="currentColor"><path d="M480-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Zm80-80h480v-32q0-11-5.5-20T700-306q-54-27-109-40.5T480-360q-56 0-111 13.5T260-306q-9 5-14.5 14t-5.5 20v32Zm240-320q33 0 56.5-23.5T560-640q0-33-23.5-56.5T480-720q-33 0-56.5 23.5T400-640q0 33 23.5 56.5T480-560Zm0-80Zm0 400Z"/></svg>
      </button>
      <button class="icon-btn" type="button" aria-label="Home" onclick="window.location.href='homepage.html'">
        <svg xmlns="http://www.w3.org/2000/svg" height="24" width="24" viewBox="0 -960 960 960" fill="currentColor"><path d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z"/></svg>
      </button>
    </div>
  </nav>

  <h1 class="page-title" id="page-title">Your Final Ranking</h1>
  <ol class="ranked-list" id="ranked-list"></ol>

  <div class="cta-row">
    <button class="cta" id="rerank-btn">+ Re-rank your list</button>
    <button class="cta cta-outline" id="others-btn">See Others' Rankings</button>
  </div>
</div>

<script src="api.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const listId = parseInt(params.get('listId'));
  // userId param: whose ranking to show (default: logged-in user)
  const targetUserId = params.get('userId');
  const me = getUser();

  document.getElementById('back-btn').addEventListener('click', () => history.back());
  document.getElementById('others-btn').addEventListener('click', () => {
    window.location.href = `view_other_rankings.html?listId=${listId}`;
  });
  document.getElementById('rerank-btn').addEventListener('click', () => {
    if (!me) { window.location.href = 'login.html'; return; }
    window.location.href = `ranking.html?listId=${listId}`;
  });

  const MEDALS = [
    { cls: 'medal-gold',   icon: '🥇' },
    { cls: 'medal-silver', icon: '🥈' },
    { cls: 'medal-bronze', icon: '🥉' },
  ];

  async function load() {
    if (!listId || !targetUserId) { document.getElementById('ranked-list').innerHTML = '<p class="empty-msg">No ranking to display.</p>'; return; }

    const [rankRes, listRes] = await Promise.all([
      apiFetch(`/rank/results/${listId}?userId=${targetUserId}`),
      apiFetch('/lists/' + listId)
    ]);

    if (listRes.success) {
      const isOwn = me && targetUserId === me.userId;
      document.getElementById('page-title').textContent = isOwn
        ? 'Your Final Ranking'
        : `${targetUserId}'s Final Ranking`;
      // Resolve username if possible
      if (!isOwn) {
        const userRes = await apiFetch('/auth/users/' + targetUserId);
        if (userRes.success) document.getElementById('page-title').textContent = `${userRes.data.username}'s Final Ranking`;
      }
    }

    if (!rankRes.success) {
      document.getElementById('ranked-list').innerHTML = '<p class="empty-msg">No ranking found.</p>';
      return;
    }

    const list = document.getElementById('ranked-list');
    list.innerHTML = '';
    rankRes.data.ranking.forEach((item, i) => {
      const li = document.createElement('li');
      const medal = i < 3 ? `<span class="medal ${MEDALS[i].cls}">${MEDALS[i].icon}</span>` : '';
      li.innerHTML = `<span class="rank-num">#${i + 1}</span>${medal}<span class="item-label">${item}</span>`;
      list.appendChild(li);
    });
  }

  load();
</script>
</body>
</html>
