<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EverythingRanker — Rankings</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #3D3D3D; --nav-bg: #1D1D1D; --header-bg: rgba(42,42,42,.37);
    --row-light: #6A6866; --row-dark: #525252;
    --orange: #F9AD60; --blue: #71A5FF; --text: #FFFFFF;
    --text-muted: rgba(255,255,255,.46); --btn-text: #000; --icon-fill: #E3E3E3;
    --shadow-text-nav: -4px 4px 4px rgba(0,0,0,.25);
    --radius-pill: 20px; --radius-row: 10px; --radius-btn: 18px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); min-height: 100vh; padding: 20px 20px 60px; }
  .container { max-width: 1400px; margin: 0 auto; }
  .navbar { height: 50px; background: var(--nav-bg); border-radius: var(--radius-pill); padding: 10px 35px; display: flex; justify-content: space-between; align-items: center; }
  .wordmark { font-size: 24px; font-weight: 800; text-decoration: none; text-shadow: var(--shadow-text-nav); }
  .wordmark .orange { color: var(--orange); }
  .wordmark .blue   { color: var(--blue); }
  .nav-icons { display: flex; align-items: center; gap: 46px; }
  .icon-btn { background: none; border: none; padding: 0; cursor: pointer; display: inline-flex; align-items: center; color: var(--icon-fill); transition: opacity .15s; }
  .icon-btn:hover { opacity: .75; }
  .page-title { margin-top: 54px; text-align: center; font-size: 48px; font-weight: 600; }
  .rankings { margin-top: 48px; width: 1008px; max-width: 100%; margin-left: auto; margin-right: auto; display: flex; flex-direction: column; gap: 11px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; align-items: center; height: 41px; border-radius: var(--radius-row); padding: 0 78px; }
  .row .cell { font-size: 20px; font-weight: 600; text-align: center; }
  .row-header { background: var(--header-bg); }
  .row-header .cell { color: var(--text-muted); }
  .rows-body { display: flex; flex-direction: column; }
  .row-data { background: var(--row-light); cursor: pointer; transition: filter .1s; }
  .row-data:nth-child(even) { background: var(--row-dark); }
  .row-data:hover { filter: brightness(1.1); }
  .row-data .cell.username { color: var(--orange); }
  .row-data .cell.time     { color: var(--text); }
  .cta-row { margin-top: 48px; display: flex; justify-content: center; }
  .cta { height: 49px; padding: 0 28px; background: var(--orange); border: none; border-radius: var(--radius-btn); color: var(--btn-text); font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 800; cursor: pointer; transition: filter .15s; }
  .cta:hover { filter: brightness(1.05); }
  .empty-msg { text-align: center; color: var(--text-muted); padding: 24px 0; font-size: 18px; }
  @media(max-width:1080px){ .rankings { width: 100%; } .row { padding: 0 32px; } }
  @media(max-width:720px){ .navbar { padding: 10px 18px; } .page-title { font-size: 32px; } .row .cell { font-size: 16px; } }
</style>
</head>
<body>
<div class="container">
  <nav class="navbar">
    <a class="wordmark" href="homepage.html"><span class="orange">Everything</span><span class="blue">Ranker</span></a>
    <div class="nav-icons">
      <button class="icon-btn" type="button" aria-label="Profile" onclick="window.location.href='view_your_profile.html'">
        <svg xmlns="http://www.w3.org/2000/svg" height="24" width="24" viewBox="0 -960 960 960" fill="currentColor"><path d="M480-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Zm80-80h480v-32q0-11-5.5-20T700-306q-54-27-109-40.5T480-360q-56 0-111 13.5T260-306q-9 5-14.5 14t-5.5 20v32Zm240-320q33 0 56.5-23.5T560-640q0-33-23.5-56.5T480-720q-33 0-56.5 23.5T400-640q0 33 23.5 56.5T480-560Zm0-80Zm0 400Z"/></svg>
      </button>
      <a class="icon-btn" href="homepage.html" aria-label="Home">
        <svg xmlns="http://www.w3.org/2000/svg" height="24" width="24" viewBox="0 -960 960 960" fill="currentColor"><path d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z"/></svg>
      </a>
    </div>
  </nav>

  <h1 class="page-title" id="page-title">Rankings</h1>

  <section class="rankings" aria-label="User rankings">
    <div class="row row-header" role="row">
      <div class="cell" role="columnheader">Username</div>
      <div class="cell" role="columnheader">Time of Ranking</div>
    </div>
    <div class="rows-body" id="rows-body" role="rowgroup"></div>
  </section>

  <div class="cta-row">
    <button class="cta" id="rank-btn">+ Start New Ranking</button>
  </div>
</div>

<script src="api.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const listId = parseInt(params.get('listId'));
  const me = getUser();

  document.getElementById('rank-btn').addEventListener('click', () => {
    if (!me) { window.location.href = 'login.html'; return; }
    if (!listId) { window.location.href = 'homepage.html'; return; }
    window.location.href = `ranking.html?listId=${listId}`;
  });

  const usernameCache = {};
  async function resolveUsername(userId) {
    if (usernameCache[userId]) return usernameCache[userId];
    const res = await apiFetch('/auth/users/' + userId);
    const name = res.success ? res.data.username : userId;
    usernameCache[userId] = name;
    return name;
  }

  async function load() {
    if (!listId) { document.getElementById('rows-body').innerHTML = '<p class="empty-msg">No list selected.</p>'; return; }

    const [listRes, rankersRes] = await Promise.all([
      apiFetch('/lists/' + listId),
      apiFetch('/rank/rankers/' + listId)
    ]);

    if (listRes.success) {
      document.getElementById('page-title').textContent = `Rankings For ${listRes.data.title}`;
    }

    const body = document.getElementById('rows-body');
    if (!rankersRes.success || !rankersRes.data.rankers.length) {
      body.innerHTML = '<p class="empty-msg">No rankings yet. Be the first!</p>';
      return;
    }

    body.innerHTML = '';
    for (const { userId, rankedDate } of rankersRes.data.rankers) {
      const username = await resolveUsername(userId);
      const row = document.createElement('div');
      row.className = 'row row-data';
      row.setAttribute('role', 'row');
      row.innerHTML = `
        <div class="cell username" role="cell">${username}</div>
        <div class="cell time" role="cell">${timeAgo(rankedDate)}</div>
      `;
      row.addEventListener('click', () => {
        window.location.href = `view_users_ranked_list.html?listId=${listId}&userId=${userId}`;
      });
      body.appendChild(row);
    }
  }

  load();
</script>
</body>
</html>
